<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-100 flex items-center justify-center p-4 font-[Inter]"
  >
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
      <div
        class="flex flex-col space-y-5 justify-center items-center text-center"
      >
        <div
          class="w-24 h-24 flex items-center justify-center rounded-full bg-blue-50"
        >
          <img src="./images/Education logo.jpg" class="w-auto" alt="logo" />
        </div>

        <h1 class="text-3xl text-black font-bold">Edulog Academy</h1>

        <p class="text-gray-500">Result Management System</p>
      </div>
      <form id="loginForm" class="space-y-5 mt-8">
        <div class="space-y-5">
          <label for="email" class="block text-sm font-medium text-gray-700"
            ><span
              ><i class="fa-regular fa-envelope"></i> Email Address</span
            ></label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="name@example.com"
            class="p-3 bg-gray-200 rounded w-full text-black focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 border-2 border-gray-200"
            autocomplete="email"
            spellcheck="false"
            required
          />
        </div>

        <div class="space-y-5">
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              class="w-full p-3 pr-10 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition focus:outline-none"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>

          <a href="./forgot-password.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
        </div>
        <p id="loginError" class="hidden text-red-600 text-sm text-center"></p>
        <button
          type="submit"
          id="loginBtn"
          class="p-3 bg-blue-600 rounded w-[100%] text-white font-bold hover:bg-blue-700 shadow-md cursor-pointer transition-all duration-200 ease-in-out"
        >
          Sign In
        </button>
      </form>
    </div>
    <script src="./admin/js/config.js"></script>
    <script src="./admin/js/utils.js"></script>
    <script src="./admin/js/auth.js"></script>
    <script src="./admin/js/api.js"></script>
    <script src="./admin/js/login.js"></script>
  </body>
</html>
