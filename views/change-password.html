<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <link rel="stylesheet" href="./assets/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 h-screen flex items-center justify-center font-[Inter]">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
      <div class="text-center mb-8">
        <img src="./images/Education logo.jpg" alt="Edulog Academy Logo" class="w-24 h-24 mx-auto mb-4 object-contain" />
        <h1 class="text-2xl font-bold text-blue-600">Change Password</h1>
        <p class="text-gray-500 mt-2">Please change your password to continue</p>
      </div>

      <form id="changePasswordForm" class="space-y-6" novalidate>
        <div id="changePasswordError" class="hidden p-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 border border-red-200"></div>
        <div id="changePasswordSuccess" class="hidden p-3 rounded-lg text-sm font-medium bg-green-50 text-green-700 border border-green-200"></div>

        <!-- Current Password -->
        <div>
          <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <div class="relative">
            <input
              type="password"
              id="currentPassword"
              name="currentPassword"
              placeholder="Enter your current password"
              required
              class="w-full p-3 pr-10 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
            <button
              type="button"
              class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition focus:outline-none"
              data-target="currentPassword"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <div class="relative">
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter your new password"
              required
              minlength="6"
              class="w-full p-3 pr-10 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
            <button
              type="button"
              class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition focus:outline-none"
              data-target="newPassword"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-1">Password must be at least 6 characters long</p>
        </div>

        <!-- Confirm New Password -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
          <div class="relative">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your new password"
              required
              minlength="6"
              class="w-full p-3 pr-10 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
            />
            <button
              type="button"
              class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition focus:outline-none"
              data-target="confirmPassword"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="changePasswordBtn"
          class="w-full p-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <i class="fa-solid fa-lock"></i>
          Change Password
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="./login.html" class="text-sm text-blue-600 hover:underline">
          <i class="fa-solid fa-arrow-left mr-1"></i>
          Back to Login
        </a>
      </div>
    </div>

    <script src="./admin/js/config.js"></script>
    <script src="./admin/js/utils.js"></script>
    <script src="./admin/js/auth.js"></script>
    <script src="./admin/js/api.js"></script>
    <script src="./admin/js/change-password.js"></script>
  </body>
</html>
