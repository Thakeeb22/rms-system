<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="./assets/css/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 h-screen flex items-center justify-center font-[Inter]">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
      <div class="text-center mb-8">
        <img src="./images/Education logo.jpg" alt="Edulog Academy Logo" class="w-24 h-24 mx-auto mb-4 object-contain" />
        <h1 class="text-2xl font-bold text-blue-600">Reset Password</h1>
        <p class="text-gray-500 mt-2">Create a new secure password.</p>
      </div>

      <form id="resetPasswordForm" class="space-y-6" novalidate>
        <div id="resetPasswordMessage" class="hidden p-3 rounded-lg text-sm font-medium"></div>

        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password (min 8 chars)" required minlength="8" class="w-full p-3 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition" />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required minlength="8" class="w-full p-3 bg-gray-50 rounded-lg border border-gray-300 text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition" />
        </div>

        <button type="submit" id="resetPasswordBtn" class="w-full p-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
          Reset Password
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="./login.html" class="text-sm text-blue-600 hover:underline">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
        </a>
      </div>
    </div>

    <script src="./admin/js/config.js"></script>
    <script src="./admin/js/auth.js"></script>
    <script src="./admin/js/api.js"></script>
    <script src="./admin/js/utils.js"></script>
    <script src="./admin/js/reset-password.js"></script>
  </body>
</html>
